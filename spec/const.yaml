# INT-HOME, round 5. Every constraint names one check.
# kind and check rules live in spec/about.txt.
constraints:
  - id: INV-01
    kind: invariant
    statement: "构建期 emit 的每个文件名都以 fs/ 开头，且 fs/ 之后的路径对应 content/ 下的一个真实文件"
    check: { type: property, ref: tests/acc/test_site_publishes_content_only.test.ts }
    severity: block
    traces: [R2, REQ-SG-01]

  - id: INV-02
    kind: invariant
    statement: "drafts/ 下被 git 跟踪的文件只有 README.txt 一个"
    check: { type: property, ref: tests/prop/test_drafts_never_published.test.ts }
    severity: block
    traces: [R1, REQ-SG-02]

  - id: INV-03
    kind: invariant
    statement: "同一棵 content/ 上连续两次构建 emit 的文件名与字节逐条相同"
    check: { type: property, ref: tests/acc/test_site_publishes_content_only.test.ts }
    severity: block
    traces: [R2]

  - id: INV-04
    kind: invariant
    statement: "help 列出的命令名集合与命令表逐条一致，两处都没有 specgate"
    check: { type: property, ref: tests/prop/test_no_hint_anywhere.test.ts }
    severity: block
    traces: [R5, REQ-SG-05]

  - id: FORB-01
    kind: forbidden
    statement: "never (manifest 出现 /drafts/ 开头的路径)"
    check: { type: property, ref: tests/prop/test_drafts_never_published.test.ts }
    severity: block
    traces: [R2, REQ-SG-07]

  - id: FORB-02
    kind: forbidden
    statement: "never (drafts/ 里的草稿出现在 content/ 下)"
    check: { type: property, ref: tests/prop/test_drafts_never_published.test.ts }
    severity: block
    traces: [R1, REQ-SG-08]

  - id: FORB-03
    kind: forbidden
    statement: "never (README 提到 chmod 却没有一句说明它不是访问控制)"
    check: { type: lint, ref: tests/acc/test_docs_state_permission_limits.test.ts }
    severity: block
    traces: [R3, REQ-SG-09]

  - id: FORB-04
    kind: forbidden
    statement: "never (manifest 出现 /home/owner/specgate 开头的路径)"
    check: { type: property, ref: tests/prop/test_nothing_under_specgate.test.ts }
    severity: block
    traces: [R2, REQ-SG-10]

  - id: FORB-05
    kind: forbidden
    statement: "never (content/ 下出现名为 specgate 的路径段)"
    check: { type: property, ref: tests/prop/test_nothing_under_specgate.test.ts }
    severity: block
    traces: [R2, REQ-SG-11]

  - id: FORB-06
    kind: forbidden
    statement: "never (命令名、man 条目标题或补全候选出现 specgate)"
    check: { type: property, ref: tests/prop/test_no_hint_anywhere.test.ts }
    severity: block
    traces: [R5, REQ-SG-12]

  - id: PRE-01
    kind: pre
    statement: "仓库根部存在 intent/、spec/、tests/、uml/、tools/gates/ 与 drafts/ 六个目录"
    check: { type: lint, ref: tests/prop/test_architecture_artifacts.test.ts }
    severity: block
    traces: [R4, REQ-SG-04]

  - id: POST-01
    kind: post
    statement: "G-WORD-01、G-DRAFT-01、G-REF-01、G-INV-01、G-DT-01、G-DEP-01 六道门以 0 问题退出"
    check: { type: reference, ref: tools/gates/run.mjs }
    severity: block
    traces: [R4, REQ-SG-13, REQ-SG-20]

  - id: FORB-07
    kind: forbidden
    statement: "never (content/ 下任一文本文件的前五行含 DRAFT: unpublished)"
    check: { type: lint, ref: tools/gates/draftCheck.mjs }
    severity: block
    traces: [R1, REQ-SG-16]

  - id: FORB-08
    kind: forbidden
    statement: "never (content/ 下出现名为 drafts 的路径段)"
    check: { type: lint, ref: tools/gates/draftCheck.mjs }
    severity: block
    traces: [R1, REQ-SG-16]

  - id: FORB-09
    kind: forbidden
    statement: "never (manifest 里出现含 draft 的路径)"
    check: { type: property, ref: tests/acc/test_draft_guard.test.ts }
    severity: block
    traces: [R3, REQ-SG-19]

  - id: DEP-01
    kind: dependency
    statement: "src/kernel 下任一文件不得 import src/ui、src/shell、src/remote、src/mux 或 src/app"
    check: { type: lint, ref: tests/lint/test_dep_direction.test.ts }
    severity: block
    traces: []

  - id: IDEM-01
    kind: idempotency
    statement: "同一棵 content/ 上连续两次构建 emit 的文件名与字节逐条相同"
    check: { type: property, ref: tests/acc/test_site_publishes_content_only.test.ts }
    severity: block
    traces: [R2]
