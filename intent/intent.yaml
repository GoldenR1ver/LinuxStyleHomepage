# INT-HOME, round 5. Field rules live in intent/about.txt.
# Round 4 gave drafts a directory. Round 5 makes the boundary enforced: the
# build refuses a draft that leaked into content/, so "unpublished" becomes a
# property a gate checks instead of a habit a person remembers.
intent:
  id: INT-HOME
  round: 5
  owner: 李禹江

  story:
    text: "让草稿边界由构建与门来守：content/ 里出现草稿痕迹时构建直接失败，草稿在站点上有零个可访问路径。"
    non_goals:
      - "不重写终端内核：parser、VFS、tmux、vim 与权限模型保持原样"
      - "不引入后端服务、数据库或构建期生成的内容"
      - "不改写 notes/ 与 works/ 下的既有内容"
      - "不做视觉主题改版，界面仍是 Linux 终端风格"

  rules:
    - id: R1
      text: "content/ 下任一文本文件的前五行含 `DRAFT: unpublished`，或任一路径段名为 drafts 时，`npm run build` 以非 0 退出并指名该文件。"
      example: "把 `DRAFT: unpublished` 写到 `content/home/owner/wip.md` 首行，`npm run build` 失败并打印 `G-DRAFT-01` 与该路径；移到 drafts/ 后构建通过。"
      owner: 李禹江

    - id: R2
      text: "`npm run dev` 启动时对同一批痕迹给出警告，页面仍可预览。"
      example: "泄漏存在时 dev 启动照常，日志里出现 `G-DRAFT-01` 与泄漏路径。"
      owner: 李禹江

    - id: R3
      text: "构建产物的 manifest 里没有 drafts 下的任何路径，草稿在站点上的可访问路径数为 0。"
      example: "dist/fs/manifest.json 的文件列表里，含 draft 的路径为 0 条；`/fs/` 下也不存在对应文件。"
      owner: 李禹江

    - id: R4
      text: "仓库根部保留九步产物与 drafts/，六道文档门以 0 问题退出。"
      example: "`node tools/gates/run.mjs` 输出 G-WORD-01、G-DRAFT-01、G-REF-01、G-INV-01、G-DT-01、G-DEP-01 六行，全部 0。"
      owner: 李禹江

    - id: R5
      text: "原有命令在相同输入下的 stdout 字节不变；`npm test` 的失败数为 0。"
      example: "`npm test` 全绿；构建产物文件名与第 4 轮相同。"
      owner: 李禹江

  judge:
    - id: J1
      text: "草稿不会因为一次疏忽进入站点。"
      measurable: "泄漏样本下构建退出码非 0；干净树上构建退出码 0；manifest 含 draft 的条目 0 条。"
      check: gate

    - id: J2
      text: "边界只有一处实现。"
      measurable: "构建与 G-DRAFT-01 调用同一个 check 函数；实现文件 1 个。"
      check: gate

    - id: J3
      text: "原有界面不回归。"
      measurable: "`npm test` 失败数 0；`git diff src/` 相对上一轮为 0 字节。"
      check: gate

    - id: J4
      text: "一层的文件只读上游。"
      measurable: "spec 引 intent 外的条件 0 条；const 引 spec 与决策表外的条件 0 条。"
      check: review

  questions:
    - id: Q1
      text: "草稿标记之外，是否还要按文件名比对 drafts/ 与 content/ 的重名？"
      kind: ub
      owner: 李禹江
      blocking: [R1]
      status: open

    - id: Q2
      text: "将来若要给草稿加访问控制，是接受引入后端鉴权，还是继续靠私有仓库隔离？"
      kind: ub
      owner: 李禹江
      blocking: [R3]
      status: open
